# RSProx Configuration
# RSProt 237 Private Server — RSProx Integration
#
# RSProx intercepts packets between the OSRS client and your private server.
# It allows you to inspect, modify, and log packets in real time.
#
# GitHub: https://github.com/blurite/rsprox
#
# SETUP:
# 1. Build/download RSProx from the repo above
# 2. Place this config as rsprox.properties in the RSProx working directory
# 3. Start your private server (osrs-server) on port 43594
# 4. Start RSProx — it will listen on proxy.port (default 40000)
# 5. Point your OSRS client at 127.0.0.1:40000

# The real OSRS server that RSProx forwards to.
# Change this to your private server's address.
server.host=127.0.0.1
server.port=43594

# RSProx listens on this port; the OSRS client connects here.
proxy.host=127.0.0.1
proxy.port=40000

# OSRS revision to use for decoding.
# Must match both RSProt and your server revision.
revision=237

# Logging verbosity: ALL, GAME, IMPORTANT, NONE
log.level=ALL

# Log file location
log.file=./logs/rsprox.log

# Whether to dump raw packet bytes (useful for opcode debugging)
dump.raw=true
dump.decoded=true

# Packet filter — leave blank to log everything
# format: OPCODE1,OPCODE2,... (server or client opcode numbers)
filter.server=
filter.client=
